---
name: Reviewdog
on: [pull_request, push]
permissions:
    pull-requests: write
jobs:
    python_check:
        strategy:
            matrix:
                workdir:
                    - .
        name: python_check
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v3

            - name: Install the latest version of uv
              uses: astral-sh/setup-uv@v3
              with:
                  version: "latest"

            - uses: reviewdog/action-setup@v1
              with:
                  reviewdog_version: latest

            - name: ruff check
              env:
                  REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.github_token }}
              run: |
                  uvx ruff check . | reviewdog -efm="%f:%l:%c: %m" -name=ruff-check -reporter=github-pr-review -fail-on-error=true -filter-mode=nofilter
              working-directory: ${{ matrix.workdir }}

            - name: ruff format
              env:
                  REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.github_token }}
              run: |
                  uvx ruff format --diff --check . | reviewdog -f=diff -name=ruff-format -reporter=github-pr-review
              working-directory: ${{ matrix.workdir }}
